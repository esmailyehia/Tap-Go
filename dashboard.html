<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap & Go | لوحة الإدارة</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#0d0d0d;color:#fff;padding:20px;display:flex;justify-content:center}
.box{width:100%;max-width:560px;background:#161616;padding:22px;border-radius:16px;border:1px solid #2a2a2a}
h2{text-align:center;margin-bottom:16px}
label{display:block;font-size:13px;color:#bbb;margin-bottom:6px}
input,select{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid #333;background:#222;color:#fff;font-size:14px}
button{width:100%;padding:12px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;font-size:15px;transition:.2s}
.btn-primary{background:#fff;color:#000}.btn-primary:hover{background:#e0e0e0}.btn-primary:disabled{background:#666}
.btn-secondary{background:#2a2a2a;color:#fff;margin-top:8px}
.btn-danger{background:#ff3b30;color:#fff;width:auto;padding:8px 12px;font-size:12px}
.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.topbar button{width:auto;padding:8px 14px;font-size:13px;margin:0}
.toolbar{display:flex;gap:8px;margin-bottom:6px}.toolbar input{margin:0}.toolbar button{width:auto;white-space:nowrap}
.count{font-size:12px;color:#888;margin:8px 0}
.client{display:flex;align-items:center;gap:12px;background:#1e1e1e;border:1px solid #2f2f2f;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.avatar{width:46px;height:46px;border-radius:50%;background:#fff;color:#000;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.cinfo{flex:1;min-width:0}.cinfo b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cinfo small{color:#888;direction:ltr;display:inline-block}
.acts{display:flex;gap:6px}.acts button{width:34px;height:34px;padding:0;background:#2a2a2a;color:#ddd;font-size:13px}
.acts button:hover{background:#3a3a3a}.acts button:last-child{color:#ff6b6b}
.empty{text-align:center;color:#777;padding:30px 0}
.link-item{background:#222;padding:12px;border-radius:8px;margin-bottom:10px;border:1px solid #333}
.helper-hint{font-size:11px;color:#25d366;margin:-6px 0 10px;display:none}
.share-box{background:#1e2a24;border:1px solid #25d366;padding:12px;border-radius:8px;margin-bottom:16px;text-align:center}
.share-box a{color:#25d366;font-weight:bold;word-break:break-all;display:block;margin:8px 0;direction:ltr}
.branding{background:#1c1c1c;border:1px solid #2f2f2f;border-radius:12px;padding:15px;margin:15px 0}
.branding h3{font-size:15px;margin-bottom:12px}
.file-row{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #2a2a2a}.file-row:last-child{border:0;margin:0;padding:0}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid #444;background:#111}
.ok{font-size:12px;color:#25d366}
.btn-clear{background:#332020;color:#ff6b6b;width:auto;padding:6px 10px;font-size:12px}
</style>
</head>
<body>
<div class="box">

<!-- دخول المسؤول -->
<div id="authSection">
  <h2>Tap & Go | دخول الإدارة</h2>
  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <input type="password" id="password" placeholder="كلمة المرور">
  <button class="btn-primary" onclick="login()">تسجيل الدخول</button>
</div>

<!-- قائمة العملاء -->
<div id="listSection" class="hidden">
  <div class="topbar"><h2 style="margin:0">العملاء</h2><button class="btn-secondary" onclick="logout()">خروج</button></div>
  <div class="toolbar">
    <input id="search" placeholder="ابحث بالاسم أو اليوزرنيم..." oninput="renderList()">
    <button class="btn-primary" onclick="openEditor()">+ عميل جديد</button>
  </div>
  <div class="count" id="count"></div>
  <div id="clientsList"></div>
</div>

<!-- محرر العميل -->
<div id="editSection" class="hidden">
  <div class="topbar"><h2 style="margin:0;font-size:18px" id="editTitle"></h2><button class="btn-secondary" onclick="backToList()">← رجوع</button></div>

  <div class="share-box hidden" id="shareBox">
    <span>رابط الكارت:</span>
    <a id="publicLink" href="#" target="_blank">...</a>
    <button class="btn-secondary" onclick="copyCurrent()">نسخ الرابط <i class="fa-regular fa-copy"></i></button>
  </div>

  <label>اسم الرابط (Username بالإنجليزية بدون مسافات):</label>
  <input id="username" dir="ltr" placeholder="roma-cafe">
  <label>اسم النشاط التجاري:</label>
  <input id="businessName" placeholder="Roma Cafe">
  <label>وصف قصير:</label>
  <input id="bio" placeholder="أهلاً بك! اختر الخدمة المطلوبة">

  <div class="branding">
    <h3><i class="fa-solid fa-palette"></i> هوية المكان (اختياري)</h3>
    <div class="file-row">
      <label>لوجو المكان (يسحب الألوان تلقائياً):</label>
      <input type="file" id="logoInput" accept="image/*" style="margin-bottom:4px">
      <div class="pbar hidden" id="logoBar"><img id="logoPrev" class="thumb" alt=""><span class="ok">✓ اللوجو جاهز</span><button type="button" class="btn-clear" onclick="clearMedia('logo')">حذف</button></div>
    </div>
    <div class="file-row">
      <label>صورة خلفية (تظهر مموهة):</label>
      <input type="file" id="bgInput" accept="image/*" style="margin-bottom:4px">
      <div class="pbar hidden" id="bgBar"><img id="bgPrev" class="thumb" alt=""><span class="ok">✓ الخلفية جاهزة</span><button type="button" class="btn-clear" onclick="clearMedia('bg')">حذف</button></div>
    </div>
    <div class="file-row">
      <label>خط مخصص (.ttf / .otf / .woff2 - حد أقصى 200KB):</label>
      <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2" style="margin-bottom:4px">
      <div class="pbar hidden" id="fontBar"><span class="ok" id="fontTxt">✓ خط مرفق</span><button type="button" class="btn-clear" onclick="clearMedia('font')">حذف</button></div>
    </div>
  </div>

  <h3 style="margin:15px 0 10px;font-size:16px">الأزرار والروابط:</h3>
  <div id="linksList"></div>
  <button class="btn-secondary" onclick="addLinkField()">+ إضافة رابط جديد</button>
  <button class="btn-primary" id="saveBtn" style="margin-top:15px" onclick="saveProfile()">حفظ</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, addDoc, deleteDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAyFSsxxB2nNA5AbrCMooVap67go538c_Y",
  authDomain: "tap-and-g0.firebaseapp.com",
  projectId: "tap-and-g0",
  storageBucket: "tap-and-g0.firebasestorage.app",
  messagingSenderId: "562027850272",
  appId: "1:562027850272:web:5a6d664469b0d8a8116a45",
  measurementId: "G-E0C9VEV12J"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const show = n => ["authSection","listSection","editSection"].forEach(s => $(s).classList.toggle("hidden", s !== n));
const linkFor = u => location.origin + location.pathname.replace(/[^/]*$/, "index.html") + "?u=" + u;
const BANK = "fa-solid fa-building-columns";
let clients = [], editingId = null, logo = null, bg = null, font = null;

/* ---------- دخول ---------- */
onAuthStateChanged(auth, async u => {
  if (u) { await loadClients(); show("listSection"); } else show("authSection");
});
window.login = async () => {
  try { await signInWithEmailAndPassword(auth, $("email").value, $("password").value); }
  catch (e) { alert("خطأ في الدخول: " + e.message); }
};
window.logout = () => signOut(auth);

/* ---------- قائمة العملاء ---------- */
async function loadClients() {
  const snap = await getDocs(collection(db, "profiles"));
  clients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  clients.sort((a, b) => (b.updatedAt?.toMillis?.() || 0) - (a.updatedAt?.toMillis?.() || 0));
  renderList();
}
window.renderList = () => {
  const q = $("search").value.trim().toLowerCase();
  const box = $("clientsList"); box.innerHTML = "";
  const items = clients.filter(c => (c.businessName || "").toLowerCase().includes(q) || (c.username || "").includes(q));
  $("count").textContent = items.length + " عميل";
  if (!items.length) { box.innerHTML = '<div class="empty">لا يوجد عملاء بعد. اضغط "+ عميل جديد"</div>'; return; }
  items.forEach(c => {
    const row = document.createElement("div"); row.className = "client";
    const av = document.createElement("div"); av.className = "avatar";
    if (c.logoUrl) { const im = document.createElement("img"); im.src = c.logoUrl; av.append(im); }
    else av.textContent = (c.businessName || "?").slice(0, 2).toUpperCase();
    const info = document.createElement("div"); info.className = "cinfo";
    const n = document.createElement("b"); n.textContent = c.businessName || "—";
    const u = document.createElement("small"); u.textContent = "@" + (c.username || "");
    info.append(n, u);
    const acts = document.createElement("div"); acts.className = "acts";
    [["fa-pen","تعديل",() => openEditor(c)],
     ["fa-copy","نسخ الرابط",() => copyLink(c.username)],
     ["fa-clone","تكرار",() => openEditor(c, true)],
     ["fa-trash","حذف",() => removeClient(c)]].forEach(([ic, t, fn]) => {
      const b = document.createElement("button"); b.title = t;
      b.innerHTML = '<i class="fa-solid ' + ic + '"></i>'; b.onclick = fn; acts.append(b);
    });
    row.append(av, info, acts); box.append(row);
  });
};
function copyLink(u) { navigator.clipboard.writeText(linkFor(u)); alert("تم نسخ الرابط ✓"); }
window.copyCurrent = () => copyLink($("username").value.trim());
async function removeClient(c) {
  if (!confirm("حذف " + c.businessName + " نهائياً؟")) return;
  await deleteDoc(doc(db, "profiles", c.id)); await loadClients();
}
window.backToList = async () => { await loadClients(); show("listSection"); };

/* ---------- المحرر ---------- */
window.openEditor = (c = null, dup = false) => {
  const d = c || {};
  editingId = c && !dup ? c.id : null;
  $("editTitle").textContent = editingId ? "تعديل: " + d.businessName : (dup ? "نسخة من " + d.businessName : "عميل جديد");
  $("username").value = dup ? (d.username || "") + "-copy" : (d.username || "");
  $("businessName").value = dup ? "" : (d.businessName || "");
  $("bio").value = d.bio || "";
  logo = d.logoUrl || null; bg = d.bgImageUrl || null; font = d.fontData || null;
  ["logo","bg","font"].forEach(k => { $(k + "Input").value = ""; });
  syncMedia();
  $("linksList").innerHTML = "";
  (d.links || []).forEach(addLinkField);
  if (!d.links || !d.links.length) addLinkField();
  const has = editingId && d.username;
  $("shareBox").classList.toggle("hidden", !has);
  if (has) { $("publicLink").href = linkFor(d.username); $("publicLink").textContent = linkFor(d.username); }
  show("editSection"); window.scrollTo(0, 0);
};

function syncMedia() {
  $("logoBar").classList.toggle("hidden", !logo); if (logo) $("logoPrev").src = logo;
  $("bgBar").classList.toggle("hidden", !bg); if (bg) $("bgPrev").src = bg;
  $("fontBar").classList.toggle("hidden", !font);
}
window.clearMedia = t => { if (t === "logo") logo = null; if (t === "bg") bg = null; if (t === "font") font = null; $(t + "Input").value = ""; syncMedia(); };

function compress(file, max, q) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > max) { h = Math.round(h * max / w); w = max; } else if (h > max) { w = Math.round(w * max / h); h = max; }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        res(file.type === "image/png" && max <= 300 ? cv.toDataURL("image/png") : cv.toDataURL("image/webp", q));
      };
      img.onerror = rej; img.src = e.target.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
$("logoInput").addEventListener("change", async e => { const f = e.target.files[0]; if (!f) return; logo = await compress(f, 260, .85); syncMedia(); });
$("bgInput").addEventListener("change", async e => { const f = e.target.files[0]; if (!f) return; bg = await compress(f, 900, .72); syncMedia(); });
$("fontInput").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 200 * 1024) { alert("حجم الخط كبير (الحد 200KB)"); e.target.value = ""; return; }
  const r = new FileReader();
  r.onload = () => { font = r.result; $("fontTxt").textContent = "✓ الخط: " + f.name; syncMedia(); };
  r.readAsDataURL(f);
});

/* ---------- الروابط ---------- */
const ICONS = [["fa-solid fa-utensils","منيو (Menu)"],["fa-solid fa-star","تقييم جوجل (Google Review)"],["fa-brands fa-whatsapp","واتساب (رقم مباشر)"],["fa-solid fa-phone","اتصال مباشر (رقم تليفون)"],["fa-brands fa-facebook","فيسبوك"],["fa-brands fa-instagram","إنستجرام"],["fa-brands fa-tiktok","تيك توك"],["fa-solid fa-wallet","دفع كاش (نسخ الرقم)"],[BANK,"حساب بنكي (رقم الحساب + IBAN)"],["fa-solid fa-location-dot","الموقع (Location)"],["fa-solid fa-link","رابط عام"]];
const HINTS = {
  "fa-brands fa-whatsapp": ["رقم الواتساب فقط (01012345678)", "يتحول تلقائياً لرابط محادثة", "تواصل معنا عبر WhatsApp"],
  "fa-solid fa-phone": ["رقم التليفون (01012345678 أو 0224567890)", "الضغط يفتح شاشة الاتصال مباشرة", "اتصل بنا"],
  "fa-solid fa-wallet": ["رقم المحفظة (01012345678)", "الضغط ينسخ الرقم للعميل", "الدفع عبر محفظة كاش"],
  [BANK]: [null, "يظهر رقم الحساب والـ IBAN مع زر نسخ", "بيانات التحويل البنكي"]
};
window.addLinkField = (l = {}) => {
  const icon = ICONS.some(i => i[0] === l.icon) ? l.icon : "fa-solid fa-link";
  const div = document.createElement("div"); div.className = "link-item";
  div.innerHTML = '<select class="link-icon">' + ICONS.map(i => '<option value="' + i[0] + '">' + i[1] + '</option>').join("") + '</select>' +
    '<input class="link-title" placeholder="عنوان الزر (مثال: المنيو الديجيتال)">' +
    '<input class="link-url" dir="ltr" placeholder="الرابط (https://...)">' +
    '<div class="bank hidden"><input class="bank-account-input" dir="ltr" placeholder="رقم الحساب البنكي"><input class="bank-iban-input" dir="ltr" placeholder="IBAN (EG38...)"></div>' +
    '<div class="helper-hint"></div><button type="button" class="btn-danger">حذف</button>';
  const sel = div.querySelector(".link-icon"), title = div.querySelector(".link-title"), url = div.querySelector(".link-url"),
        acc = div.querySelector(".bank-account-input"), iban = div.querySelector(".bank-iban-input"), hint = div.querySelector(".helper-hint");
  sel.value = icon; title.value = l.title || "";
  url.value = /^https?:\/\/wa\.me\/2(01[0125]\d{8})$/.test(l.url || "") ? l.url.replace(/^https?:\/\/wa\.me\/2/, "")
    : (l.icon === "fa-solid fa-phone" ? (l.url || "").replace(/^tel:(\+2)?/, "") : (l.url || ""));
  acc.value = l.bankAccount || (icon === BANK && !l.iban ? (l.url || "") : ""); iban.value = l.iban || "";
  const sync = () => {
    const v = sel.value, h = HINTS[v];
    div.querySelector(".bank").classList.toggle("hidden", v !== BANK);
    url.classList.toggle("hidden", v === BANK);
    if (h) { if (h[0]) url.placeholder = h[0]; hint.textContent = "✓ " + h[1]; hint.style.display = "block"; if (!title.value) title.value = h[2]; }
    else { url.placeholder = "الرابط (https://...)"; hint.style.display = "none"; }
  };
  sel.onchange = sync; div.querySelector(".btn-danger").onclick = () => div.remove();
  $("linksList").appendChild(div); sync();
};

/* ---------- الحفظ ---------- */
window.saveProfile = async () => {
  const btn = $("saveBtn");
  const username = $("username").value.trim().toLowerCase().replace(/\s+/g, "-");
  const businessName = $("businessName").value.trim();
  if (!username || !businessName) return alert("يرجى إدخال اسم الرابط واسم النشاط");
  if (!/^[a-z0-9-]{2,40}$/.test(username)) return alert("اسم الرابط: حروف إنجليزية صغيرة وأرقام وشرطة فقط");

  const links = []; let badPhone = false;
  document.querySelectorAll(".link-item").forEach(it => {
    const title = it.querySelector(".link-title").value.trim(), icon = it.querySelector(".link-icon").value;
    if (!title) return;
    if (icon === BANK) {
      const bankAccount = it.querySelector(".bank-account-input").value.trim();
      const iban = it.querySelector(".bank-iban-input").value.trim().toUpperCase();
      if (bankAccount || iban) links.push({ title, icon, bankAccount, iban, url: bankAccount || iban });
    } else {
      let url = it.querySelector(".link-url").value.trim(); if (!url) return;
      if (icon === "fa-brands fa-whatsapp") {
        const p = url.replace(/\s+/g, "").replace(/^\+?2/, "");
        if (/^01[0125]\d{8}$/.test(p)) url = "https://wa.me/2" + p;
      } else if (icon === "fa-solid fa-phone") {
        const p = url.replace(/[\s\-()]/g, "");
        if (/^\+\d{8,15}$/.test(p)) url = "tel:" + p;
        else if (/^0\d{7,11}$/.test(p)) url = "tel:+2" + p;
        else { badPhone = true; return; }
      } else if (icon === "fa-brands fa-facebook" && !/^https?:\/\//i.test(url)) url = "https://" + url;
      links.push({ title, url, icon });
    }
  });

  if (badPhone) return alert("رقم التليفون غير صحيح. اكتبه بالشكل 01012345678 أو +201012345678");
  btn.disabled = true; btn.textContent = "جاري الحفظ...";
  try {
    const snap = await getDocs(query(collection(db, "profiles"), where("username", "==", username)));
    let taken = false; snap.forEach(d => { if (d.id !== editingId) taken = true; });
    if (taken) return alert("اسم الرابط ده مستخدم لعميل تاني، اختار اسم غيره");

    const payload = { username, businessName, bio: $("bio").value.trim(), logoUrl: logo || null, bgImageUrl: bg || null, fontData: font || null, links, updatedAt: new Date() };
    if (new Blob([JSON.stringify(payload)]).size > 900000) return alert("حجم البيانات كبير. قلل حجم الخط أو الصورة.");

    if (editingId) await setDoc(doc(db, "profiles", editingId), payload);
    else { payload.createdAt = new Date(); editingId = (await addDoc(collection(db, "profiles"), payload)).id; }

    $("publicLink").href = linkFor(username); $("publicLink").textContent = linkFor(username);
    $("shareBox").classList.remove("hidden");
    $("editTitle").textContent = "تعديل: " + businessName;
    alert("تم الحفظ ✓");
  } catch (e) { alert("حدث خطأ أثناء الحفظ: " + e.message); }
  finally { btn.disabled = false; btn.textContent = "حفظ"; }
};
</script>
</body>
</html>
