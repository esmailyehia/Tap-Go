<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap & Go | Smart Menu & Links</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .brand-header {
            margin-bottom: 25px;
        }
        .logo-box {
            width: 90px;
            height: 90px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
        .brand-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .brand-subtitle {
            font-size: 14px;
            color: #a0a0a0;
            margin-top: 5px;
        }
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-card {
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .link-card:hover {
            background: #252525;
            border-color: #ffffff;
            transform: translateY(-2px);
        }
        .link-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .link-info i {
            font-size: 20px;
            width: 25px;
        }
        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #666666;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo & Brand Info -->
        <div class="brand-header">
            <div class="logo-box">T&G</div>
            <h1 class="brand-title">Tap & Go</h1>
            <p class="brand-subtitle">أهلاً بك! اختر الخدمة المطلوبة بلمسة واحدة</p>
        </div>

        <!-- Links Section -->
        <div class="links-wrapper">
            <!-- Instagram (Tap & Go Account) -->
            <a href="https://www.instagram.com/tapa.ndgo?xtok=MWx5aTFuMjl6ZWJnYw==" class="link-card" target="_blank">
                <div class="link-info">
                    <i class="fa-brands fa-instagram" style="color: #e1306c;"></i>
                    <span>صفحتنا على Instagram</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>

            <!-- WhatsApp (Direct Chat) -->
            <a href="https://wa.me/qr/UYIG566SPABQD1" class="link-card" target="_blank">
                <div class="link-info">
                    <i class="fa-brands fa-whatsapp" style="color: #25d366;"></i>
                    <span>تواصل معنا عبر WhatsApp</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>

            <!-- Google Review Placeholder -->
            <a href="#" class="link-card" target="_blank">
                <div class="link-info">
                    <i class="fa-solid fa-star" style="color: #ffcc00;"></i>
                    <span>تقييم المكان على Google</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>

            <!-- Digital Menu Placeholder -->
            <a href="#" class="link-card" target="_blank">
                <div class="link-info">
                    <i class="fa-solid fa-utensils" style="color: #ffffff;"></i>
                    <span>المنيو الديجيتال (Digital Menu)</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            Powered by <strong>Tap & Go</strong> | Eng / Esmail Yehia
        </div>
    </div>

</body>
</html>
