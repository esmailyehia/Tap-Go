<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap & Go</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ffffff;
            --card-bg: rgba(26, 26, 26, 0.78);
            --card-hover: rgba(45, 45, 45, 0.92);
            --text-color: #ffffff;
            --subtext-color: #c8c8c8;
            --border-color: rgba(255, 255, 255, 0.22);
            --client-font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --bg-blur: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--client-font); }

        body {
            background: #0d0d0d;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .dynamic-bg {
            position: fixed;
            inset: -25px;
            background-size: cover;
            background-position: center;
            filter: blur(var(--bg-blur));
            transform: scale(1.06);
            z-index: -2;
            transition: background-image 0.5s ease;
        }

        .dynamic-bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.72) 100%);
            z-index: -1;
        }

        .container { width: 100%; max-width: 400px; text-align: center; position: relative; z-index: 1; }

        .logo-box {
            width: 96px; height: 96px;
            background: #fff;
            color: #000;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px;
            font-size: 28px; font-weight: bold;
            border: 3px solid var(--primary-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .brand-title {
            font-size: 25px;
            font-weight: 700;
            color: var(--text-color);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--subtext-color);
            margin: 6px 0 25px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
        }

        .links-wrapper { display: flex; flex-direction: column; gap: 14px; }

        .link-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none;
            color: var(--text-color);
            font-size: 15px; font-weight: 600;
            transition: all 0.25s ease;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .link-card:hover {
            background: var(--card-hover);
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .link-info { display: flex; align-items: center; gap: 12px; }
        .link-info i { font-size: 20px; width: 25px; text-align: center; color: var(--primary-color); }

        .footer { margin-top: 35px; font-size: 12px; color: rgba(255, 255, 255, 0.65); }
        .footer a { color: rgba(255, 255, 255, 0.9); text-decoration: none; }

        /* نوافذ النسخ (محفظة / حساب بنكي + IBAN) */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
            z-index: 9999; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-box {
            background: #1a1a1a; border: 1px solid var(--border-color); color: #fff; padding: 24px;
            border-radius: 16px; max-width: 360px; width: 100%; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .modal-desc { font-size: 13px; color: #a0a0a0; margin-bottom: 16px; }
        .field-label { font-size: 12px; color: #bbb; margin-bottom: 6px; text-align: right; }
        .wallet-num {
            background: #0d0d0d; border: 1px dashed var(--primary-color); padding: 12px; border-radius: 10px;
            font-size: 17px; font-weight: bold; letter-spacing: 0.8px; margin-bottom: 10px;
            user-select: all; direction: ltr; word-break: break-all;
        }
        .btn-copy {
            background: var(--primary-color); color: #000; border: none; padding: 11px; border-radius: 10px;
            font-size: 14px; font-weight: 700; width: 100%; cursor: pointer; margin-bottom: 14px;
        }
        .btn-close {
            background: transparent; color: #888; border: none; padding: 8px;
            font-size: 13px; width: 100%; cursor: pointer;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="dynamic-bg" id="dynamicBg"></div>
<div class="dynamic-bg-overlay" id="dynamicBgOverlay"></div>

<div class="container">
    <div class="logo-box" id="logoBox">T&G</div>
    <h1 class="brand-title" id="brandName">جاري التحميل...</h1>
    <p class="brand-subtitle" id="brandSubtitle"></p>

    <div class="links-wrapper" id="linksContainer"></div>

    <div class="footer">
        Powered by <a href="dashboard.html"><strong>Tap & Go</strong></a> | 01006901765
    </div>
</div>

<!-- نافذة المحفظة الكاش -->
<div class="modal-overlay" id="walletModal" onclick="if(event.target===this) this.style.display='none'">
    <div class="modal-box">
        <div class="modal-title" id="walletModalTitle">التحويل عبر محفظة كاش</div>
        <div class="modal-desc">تم نسخ الرقم تلقائياً، افتح تطبيق المحفظة واعمل لصق</div>
        <div class="wallet-num" id="walletNumberDisplay"></div>
        <button class="btn-copy" id="copyWalletBtn">✓ تم نسخ الرقم</button>
        <button class="btn-close" onclick="document.getElementById('walletModal').style.display='none'">إغلاق</button>
    </div>
</div>

<!-- نافذة الحساب البنكي + IBAN -->
<div class="modal-overlay" id="bankModal" onclick="if(event.target===this) this.style.display='none'">
    <div class="modal-box">
        <div class="modal-title" id="bankModalTitle">بيانات الحساب البنكي</div>
        <div class="modal-desc">اضغط على زر النسخ أسفل الرقم المطلوب للتحويل</div>

        <div id="accountSection" class="hidden">
            <div class="field-label">رقم الحساب البنكي (Account Number):</div>
            <div class="wallet-num" id="bankAccountDisplay"></div>
            <button class="btn-copy" id="copyAccountBtn">نسخ رقم الحساب</button>
        </div>

        <div id="ibanSection" class="hidden">
            <div class="field-label">الرقم المصرفي الدولي (IBAN):</div>
            <div class="wallet-num" id="bankIbanDisplay"></div>
            <button class="btn-copy" id="copyIbanBtn">نسخ رقم الـ IBAN</button>
        </div>

        <button class="btn-close" onclick="document.getElementById('bankModal').style.display='none'">إغلاق</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyFSsxxB2nNA5AbrCMooVap67go538c_Y",
        authDomain: "tap-and-g0.firebaseapp.com",
        projectId: "tap-and-g0",
        storageBucket: "tap-and-g0.firebasestorage.app",
        messagingSenderId: "562027850272",
        appId: "1:562027850272:web:5a6d664469b0d8a8116a45",
        measurementId: "G-E0C9VEV12J"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const username = params.get("u");

    function autoThemeFromLogo(imgElement) {
        try {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = 50;
            canvas.height = 50;
            ctx.drawImage(imgElement, 0, 0, 50, 50);

            const pixels = ctx.getImageData(0, 0, 50, 50).data;
            let r = 0, g = 0, b = 0, count = 0;

            for (let i = 0; i < pixels.length; i += 4) {
                const alpha = pixels[i + 3];
                if (alpha < 128) continue;

                const pr = pixels[i], pg = pixels[i + 1], pb = pixels[i + 2];
                const brightness = (pr + pg + pb) / 3;
                if (brightness > 240 || brightness < 15) continue;

                r += pr; g += pg; b += pb;
                count++;
            }

            if (count > 0) {
                r = Math.round(r / count);
                g = Math.round(g / count);
                b = Math.round(b / count);

                const accentR = Math.min(255, Math.round(r + (255 - r) * 0.35));
                const accentG = Math.min(255, Math.round(g + (255 - g) * 0.35));
                const accentB = Math.min(255, Math.round(b + (255 - b) * 0.35));

                const root = document.documentElement;
                root.style.setProperty("--primary-color", `rgb(${accentR}, ${accentG}, ${accentB})`);
                root.style.setProperty("--card-bg", `rgba(${Math.round(r * 0.35)}, ${Math.round(g * 0.35)}, ${Math.round(b * 0.35)}, 0.78)`);
                root.style.setProperty("--card-hover", `rgba(${Math.round(r * 0.55)}, ${Math.round(g * 0.55)}, ${Math.round(b * 0.55)}, 0.92)`);
                root.style.setProperty("--border-color", `rgba(${accentR}, ${accentG}, ${accentB}, 0.45)`);

                const bgEl = document.getElementById("dynamicBg");
                if (!bgEl.style.backgroundImage) {
                    document.body.style.background = `radial-gradient(circle at top, rgba(${r}, ${g}, ${b}, 0.45), #0d0d0d 75%)`;
                }
            }
        } catch (e) {}
    }

    async function applyCustomFont(fontData) {
        if (!fontData) return;
        try {
            const fontFace = new FontFace("ClientCustomFont", `url(${fontData})`);
            await fontFace.load();
            document.fonts.add(fontFace);
            document.documentElement.style.setProperty("--client-font", "'ClientCustomFont', 'Segoe UI', sans-serif");
        } catch (err) {
            console.warn("لم يتم تحميل الخط المخصص:", err);
        }
    }

    function openWalletModal(title, phoneNumber) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(phoneNumber);
        }
        document.getElementById("walletModalTitle").innerText = title || "التحويل عبر محفظة كاش";
        document.getElementById("walletNumberDisplay").innerText = phoneNumber;

        const copyBtn = document.getElementById("copyWalletBtn");
        copyBtn.innerText = "✓ تم نسخ الرقم";
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(phoneNumber);
            copyBtn.innerText = "✓ تم النسخ بنجاح";
        };
        document.getElementById("walletModal").style.display = "flex";
    }

    function openBankModal(title, bankAccount, iban) {
        document.getElementById("bankModalTitle").innerText = title || "بيانات الحساب البنكي";

        const accSec = document.getElementById("accountSection");
        const ibanSec = document.getElementById("ibanSection");

        if (bankAccount) {
            accSec.classList.remove("hidden");
            document.getElementById("bankAccountDisplay").innerText = bankAccount;
            const accBtn = document.getElementById("copyAccountBtn");
            accBtn.innerText = "نسخ رقم الحساب";
            accBtn.onclick = () => {
                navigator.clipboard.writeText(bankAccount);
                accBtn.innerText = "✓ تم نسخ رقم الحساب";
            };
        } else {
            accSec.classList.add("hidden");
        }

        if (iban) {
            ibanSec.classList.remove("hidden");
            document.getElementById("bankIbanDisplay").innerText = iban;
            const ibanBtn = document.getElementById("copyIbanBtn");
            ibanBtn.innerText = "نسخ رقم الـ IBAN";
            ibanBtn.onclick = () => {
                navigator.clipboard.writeText(iban);
                ibanBtn.innerText = "✓ تم نسخ الـ IBAN";
            };
        } else {
            ibanSec.classList.add("hidden");
        }

        // نسخ تلقائي لأول رقم متاح بمجرد فتح النافذة
        const defaultCopy = bankAccount || iban;
        if (defaultCopy && navigator.clipboard) {
            navigator.clipboard.writeText(defaultCopy);
        }

        document.getElementById("bankModal").style.display = "flex";
    }

    async function loadPublicProfile() {
        if (!username) {
            renderProfile({
                businessName: "Tap & Go",
                bio: "ارتقِ بتجربة عملائك بلمسة واحدة",
                links: [
                    { title: "تواصل معنا عبر WhatsApp", url: "https://wa.me/qr/UYIG566SPABQD1", icon: "fa-brands fa-whatsapp" },
                    { title: "صفحتنا على Instagram", url: "https://www.instagram.com/tapa.ndgo?xtok=MWx5aTFuMjl6ZWJnYw==", icon: "fa-brands fa-instagram" }
                ]
            });
            return;
        }

        const q = query(collection(db, "profiles"), where("username", "==", username));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
            document.getElementById("brandName").innerText = "الصفحة غير موجودة";
            document.getElementById("brandSubtitle").innerText = "تأكد من صحة الرابط";
            return;
        }

        snapshot.forEach(doc => renderProfile(doc.data()));
    }

    async function renderProfile(data) {
        document.title = `${data.businessName} | Tap & Go`;
        document.getElementById("brandName").innerText = data.businessName;
        document.getElementById("brandSubtitle").innerText = data.bio || "";

        if (data.fontData) {
            await applyCustomFont(data.fontData);
        }

        const bgEl = document.getElementById("dynamicBg");
        if (data.bgImageUrl) {
            bgEl.style.backgroundImage = `url('${data.bgImageUrl}')`;
        }

        const logoBox = document.getElementById("logoBox");
        if (data.logoUrl) {
            logoBox.innerHTML = "";
            const img = document.createElement("img");
            img.crossOrigin = "anonymous";
            img.src = data.logoUrl;
            img.alt = data.businessName;
            img.onload = () => {
                if (!data.primaryColor) {
                    autoThemeFromLogo(img);
                }
            };
            logoBox.appendChild(img);
        } else {
            logoBox.innerText = data.businessName.substring(0, 2).toUpperCase();
        }

        if (data.primaryColor) {
            document.documentElement.style.setProperty("--primary-color", data.primaryColor);
        }

        const container = document.getElementById("linksContainer");
        container.innerHTML = "";
        (data.links || []).forEach(link => {
            const rawUrl = (link.url || "").trim();
            const cleanUrl = rawUrl.replace(/^https?:\/\//i, "").replace(/\s+/g, "");
            const isWalletNumber = /^(\+?2)?01[0125][0-9]{8}$/.test(cleanUrl);
            const isBankAccount = link.icon === "fa-solid fa-building-columns";

            const a = document.createElement("a");
            a.className = "link-card";
            a.innerHTML = `
                <div class="link-info">
                    <i class="${link.icon}"></i>
                    <span>${link.title}</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            `;

            if (isBankAccount) {
                const acc = link.bankAccount || (!/^https?:\/\//i.test(rawUrl) ? rawUrl : "");
                const iban = link.iban || "";
                a.href = "#";
                a.onclick = (e) => {
                    e.preventDefault();
                    openBankModal(link.title, acc, iban);
                };
            } else if (isWalletNumber) {
                const pureNumber = cleanUrl.replace(/^\+?2/, "");
                a.href = "#";
                a.onclick = (e) => {
                    e.preventDefault();
                    openWalletModal(link.title, pureNumber);
                };
            } else {
                const finalHref = /^https?:\/\//i.test(rawUrl) ? rawUrl : `https://${rawUrl}`;
                a.href = finalHref;
                a.target = "_blank";
            }

            container.appendChild(a);
        });
    }

    loadPublicProfile();
</script>
</body>
</html>
